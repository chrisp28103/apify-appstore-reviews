name: Daily live smoke test

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Live smoke test against Apple endpoints
        run: npm run test:live
        env:
          LIVE: '1'
